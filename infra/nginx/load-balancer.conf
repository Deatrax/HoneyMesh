# HoneyMesh load balancer.
#
# Sits between the outside world (host port 8080, same port the Gateway
# used to publish directly) and the two Gateway replicas. Both upstream
# servers are named by their Compose service name (gateway-1 / gateway-2);
# Docker's embedded DNS resolves each to exactly one container, so nginx
# resolves this list once at startup — no dynamic-DNS trickery needed,
# unlike trying to load-balance across a `--scale`'d service under one
# name.
#
# Load balancing algorithm: default (round robin) — good enough here since
# every backend request is stateless (no server-side session, no sticky
# routing needed; auth is a bearer token, not a cookie).
#
# Failover: max_fails=3 fail_timeout=10s is a PASSIVE health check — nginx
# doesn't proactively poll /actuator/health, it just watches real traffic.
# After 3 failed proxy attempts to a server within 10s, nginx stops sending
# it new requests for the next 10s and sends everything to the survivor
# instead; it then quietly retries the failed one. This is the open-source
# nginx way of doing failover (active health checks are an nginx-plus
# feature) — enough to demonstrate real failover if a gateway replica dies
# mid-demo, without needing a paid build or a service registry.
upstream gateway_pool {
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # Everything except the WebSocket path — plain HTTP reverse proxy.
    # This covers /api/**, the honeypot catch-all, /actuator/**, all of it,
    # since the Gateway itself is what does path-based routing to the
    # three backend services (see gateway/.../RouteConfig.java). nginx's
    # job here is only "which gateway replica", not "which backend
    # service".
    location / {
        proxy_pass http://gateway_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends $remote_addr to any existing
        # X-Forwarded-For header instead of replacing it. There isn't one
        # yet at this first hop, so this sets it to the real caller's IP —
        # Spring Cloud Gateway's own X-Forwarded-For handling then appends
        # ITS hop (this nginx container) after that. decoy-service's
        # HoneypotController.resolveClientIp() reads the FIRST entry in
        # the header, so the real attacker IP survives both hops intact.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket handshake needs the Upgrade/Connection headers forwarded
    # explicitly — a plain proxy_pass (like the block above) does not
    # forward these by default, and without them the gateway's ws:// route
    # (see RouteConfig's "incident-service-ws" route) never sees a valid
    # upgrade request.
    location /ws/ {
        proxy_pass http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived; the default 60s read
        # timeout would kill an idle-but-open /ws/alerts connection well
        # before the next 10s heartbeat.
        proxy_read_timeout 300s;
    }
}
