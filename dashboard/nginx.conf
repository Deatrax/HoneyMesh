# Serves the built React app and proxies API/WebSocket calls server-side
# to the load balancer — the containerized equivalent of vite.config.js's
# dev-server proxy (which points at localhost:8080). Because the proxy
# happens inside this container, the browser only ever talks to ONE
# origin (wherever this container is published, e.g. localhost:5173);
# every fetch('/api/...') call already in the React code
# (AuthContext.jsx, DecoysPage.jsx, ThreatsPage.jsx, etc.) works unchanged
# — same-origin, so no CORS headers needed anywhere in the stack.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter, see main.jsx) handles routing on the
    # client. Without this fallback, a hard refresh on e.g. /incidents
    # would ask nginx for a literal file at that path and get a 404 —
    # try_files falls back to index.html so the client-side router gets a
    # chance to render the right page instead.
    location / {
        try_files $uri /index.html;
    }

    # More specific prefixes win over the "/" fallback above regardless of
    # declaration order — nginx matches the longest literal prefix, not
    # first-match-wins (unlike Spring Cloud Gateway's route order or
    # Spring Security's rule order elsewhere in this project).
    location /api/ {
        proxy_pass http://load-balancer:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://load-balancer:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
