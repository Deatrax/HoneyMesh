# HoneyMesh — local/dev/demo topology
# Run:   docker compose up --build
# Stop:  docker compose down          (add -v to also wipe the postgres volume)
#
# Topology:
#   dashboard --> load-balancer --> {gateway-1, gateway-2} --> {decoy-service, threat-engine-service, incident-service}
#                                                                    |         postgres / redis / rabbitmq
#
# Two networks, not one flat bridge:
#   edge — the only network the load-balancer and dashboard sit on. Nothing
#          on this network can reach postgres/redis/rabbitmq/the backend
#          services directly; the gateways are the sole bridge between edge
#          and core.
#   core — postgres, redis, rabbitmq, the 3 backend services, and both
#          gateways (a gateway needs to be on both networks: it receives
#          traffic from the edge and forwards it into core).

networks:
  edge:
    driver: bridge
  core:
    driver: bridge

services:

  postgres:
    image: postgres:16-alpine
    container_name: honeymesh-postgres
    restart: unless-stopped
    networks:
      - core
    environment:
      POSTGRES_USER: honeymesh
      POSTGRES_PASSWORD: honeymesh_dev_pw
      POSTGRES_DB: honeymesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeymesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: honeymesh-redis
    restart: unless-stopped
    networks:
      - core
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: honeymesh-rabbitmq
    restart: unless-stopped
    networks:
      - core
    environment:
      RABBITMQ_DEFAULT_USER: honeymesh
      RABBITMQ_DEFAULT_PASS: honeymesh_dev_pw
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI -> http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  decoy-service:
    build: ./decoy-service
    container_name: honeymesh-decoy-service
    restart: unless-stopped
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/honeymesh?currentSchema=decoy
      SPRING_DATASOURCE_USERNAME: honeymesh
      SPRING_DATASOURCE_PASSWORD: honeymesh_dev_pw
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: honeymesh
      SPRING_RABBITMQ_PASSWORD: honeymesh_dev_pw
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8081"

  threat-engine-service:
    build: ./threat-engine-service
    container_name: honeymesh-threat-engine-service
    restart: unless-stopped
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/honeymesh?currentSchema=threat_engine
      SPRING_DATASOURCE_USERNAME: honeymesh
      SPRING_DATASOURCE_PASSWORD: honeymesh_dev_pw
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: honeymesh
      SPRING_RABBITMQ_PASSWORD: honeymesh_dev_pw
    ports:
      - "8082:8082"

  incident-service:
    build: ./incident-service
    container_name: honeymesh-incident-service
    restart: unless-stopped
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/honeymesh?currentSchema=incident
      SPRING_DATASOURCE_USERNAME: honeymesh
      SPRING_DATASOURCE_PASSWORD: honeymesh_dev_pw
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: honeymesh
      SPRING_RABBITMQ_PASSWORD: honeymesh_dev_pw
    ports:
      - "8083:8083"

  # Two Gateway replicas, same image, same routes (RouteConfig.java is
  # identical on both — Spring Cloud Gateway holds no per-instance state).
  # Neither is reachable from the host directly ("expose", not "ports") —
  # load-balancer is the only public entry point on 8080 now. Compose can't
  # give two containers the same container_name, so these are two explicit
  # service blocks rather than a --scale'd single one; that also means each
  # gets its own log stream, which is useful for actually demonstrating
  # failover live.
  gateway-1:
    build: ./gateway
    container_name: honeymesh-gateway-1
    restart: unless-stopped
    networks:
      - edge
      - core
    depends_on:
      - decoy-service
      - threat-engine-service
      - incident-service
    expose:
      - "8080"

  gateway-2:
    build: ./gateway
    container_name: honeymesh-gateway-2
    restart: unless-stopped
    networks:
      - edge
      - core
    depends_on:
      - decoy-service
      - threat-engine-service
      - incident-service
    expose:
      - "8080"

  # Load balancer: the "React dashboard -> Load Balancer -> Gateway" box
  # from the original design, actually built now instead of deferred.
  # Round-robins across gateway-1/gateway-2; if one is down, nginx's
  # passive health check (max_fails/fail_timeout in load-balancer.conf)
  # stops sending it traffic within a few failed requests and routes
  # everything to the survivor — no config reload needed. This container
  # now owns host port 8080, so every existing curl/script pointed at
  # localhost:8080 keeps working unchanged; it's just going through nginx
  # first instead of hitting a gateway container directly.
  load-balancer:
    image: nginx:1.27-alpine
    container_name: honeymesh-load-balancer
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      - gateway-1
      - gateway-2
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro

  # React dashboard, built and served as static files by nginx (not the
  # Vite dev server). Its own nginx.conf proxies /api and /ws to the load
  # balancer server-side, so the browser only ever talks to one origin
  # (localhost:5173) — same-origin, no CORS config needed anywhere, and
  # the exact same relative fetch('/api/...') calls the app already makes
  # work unchanged in both `npm run dev` and this containerized build.
  dashboard:
    build: ./dashboard
    container_name: honeymesh-dashboard
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      - load-balancer
    ports:
      - "5173:80"

volumes:
  pgdata:
